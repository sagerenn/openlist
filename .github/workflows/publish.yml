# Build and publish a multi-arch Docker image for openlist-ext to the GitHub
# Container Registry (GHCR). Triggered by version tags (v*). The image bundles
# the openlist-ext binary and a built OpenList-Frontend for linux/amd64 and
# linux/arm64.
name: Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name is derived from the repo owner/name, lowercased.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend (openlist-ext)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          path: openlist-ext

      - name: Checkout frontend (OpenList-Frontend)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OPENLIST_FRONTEND_REPO || 'sagerenn/OpenList-Frontend' }}
          ref: ${{ vars.OPENLIST_FRONTEND_REF || 'main' }}
          path: openlist-ext/frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/openlist-ext
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # TARGETOS/TARGETARCH are auto-injected by buildx per platform
          # (the Dockerfile declares them as ARG), so no build-args needed.
