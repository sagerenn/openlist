# Build and publish a multi-arch Docker image for openlist-ext to the GitHub
# Container Registry (GHCR). Triggered by version tags (v*). The image bundles
# the openlist-ext binary and a built OpenList-Frontend for linux/amd64 and
# linux/arm64.
name: Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build"
        required: false
        default: ""

permissions:
  # write so the workflow can create the release tag when one doesn't exist yet
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name is derived from the repo owner/name, lowercased.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve or create build ref
        id: ref
        env:
          # Token used both for the ls-remote existence check and for pushing
          # the auto-created tag (same credential path as actions/checkout).
          GH_TOKEN: ${{ github.token }}
        run: |
          # For tag pushes, github.ref is already refs/tags/v* and exists.
          # For workflow_dispatch, prefer the supplied ref input and fall back
          # to the default branch. If the ref names a version tag (v*) that
          # doesn't exist yet, auto-create it at the default branch HEAD so a
          # release can be cut by simply dispatching with the desired tag,
          # rather than failing with an opaque "git failed with exit code 1".
          ref="${{ github.event.inputs.ref || github.ref }}"
          echo "Resolved ref: ${ref}"
          # Strip refs/heads/ or refs/tags/ prefix for lookups.
          name="${ref#refs/heads/}"
          name="${name#refs/tags/}"

          repo="https://${GITHUB_ACTOR}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Does the ref already exist as a branch or tag?
          exists=false
          if git ls-remote --exit-code --heads "$repo" "$name" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags "$repo" "$name" >/dev/null 2>&1; then
            exists=true
          fi

          if [ "$exists" = "true" ]; then
            echo "Tag/branch '${name}' already exists; using it."
            if [[ "$name" == v* ]]; then
              echo "is_version_tag=true" >> "$GITHUB_OUTPUT"
              echo "version_tag=${name}" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$name" == v* ]]; then
            echo "is_version_tag=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=${name}" >> "$GITHUB_OUTPUT"
            echo "Tag '${name}' not found; auto-creating it at the default branch HEAD."
            # Shallow-fetch the default branch, tag its HEAD, and push the tag.
            # Set a git identity explicitly: the runner has none configured
            # before actions/checkout runs, and `git tag -a` requires one.
            tmp=$(mktemp -d)
            git clone --depth 1 --branch "${{ github.event.repository.default_branch }}" "$repo" "$tmp"
            sha=$(git -C "$tmp" rev-parse HEAD)
            git -C "$tmp" config user.name "github-actions[bot]"
            git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$tmp" tag -a "$name" -m "$name"
            git -C "$tmp" push origin "$name"
            rm -rf "$tmp"
            echo "Created tag '${name}' at ${sha}."
          else
            echo "::error::Ref '${ref}' not found in ${{ github.repository }} and is not a version tag (v*). Pass an existing branch/tag or a v* tag to auto-create."
            exit 1
          fi

      - name: Checkout backend (openlist-ext)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          path: openlist-ext

      - name: Checkout frontend (OpenList-Frontend)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OPENLIST_FRONTEND_REPO || 'sagerenn/OpenList-Frontend' }}
          ref: ${{ vars.OPENLIST_FRONTEND_REF || 'main' }}
          path: openlist-ext/frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || steps.ref.outputs.is_version_tag == 'true' }}
            type=raw,value=${{ steps.ref.outputs.version_tag }},enable=${{ steps.ref.outputs.is_version_tag == 'true' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/openlist-ext
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # TARGETOS/TARGETARCH are auto-injected by buildx per platform
          # (the Dockerfile declares them as ARG), so no build-args needed.
