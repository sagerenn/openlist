# Build and publish a multi-arch Docker image for openlist-ext to the GitHub
# Container Registry (GHCR). Triggered by version tags (v*). The image bundles
# the openlist-ext binary and a built OpenList-Frontend for linux/amd64 and
# linux/arm64.
#
# Each platform is built on a NATIVE runner (ubuntu-24.04 for amd64,
# ubuntu-24.04-arm for arm64) instead of QEMU emulation, which avoids the
# SIGILL crashes Node's V8 JIT hits under emulated arm64. The per-platform
# images are then united into a single multi-arch manifest with
# `docker buildx imagetools create`.
name: Publish Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build"
        required: false
        default: ""

permissions:
  # write so the workflow can create the release tag when one doesn't exist yet
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name is derived from the repo owner/name, lowercased.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Resolve or create build ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      is_version_tag: ${{ steps.ref.outputs.is_version_tag }}
      version_tag: ${{ steps.ref.outputs.version_tag }}
    steps:
      - name: Resolve or create build ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For tag pushes, github.ref is already refs/tags/v* and exists.
          # For workflow_dispatch, prefer the supplied ref input and fall back
          # to the default branch. If the ref names a version tag (v*) that
          # doesn't exist yet, auto-create it at the default branch HEAD so a
          # release can be cut by simply dispatching with the desired tag,
          # rather than failing with an opaque "git failed with exit code 1".
          ref="${{ github.event.inputs.ref || github.ref }}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: ${ref}"
          # Strip refs/heads/ or refs/tags/ prefix for lookups.
          name="${ref#refs/heads/}"
          name="${name#refs/tags/}"

          repo="https://${GITHUB_ACTOR}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Does the ref already exist as a branch or tag?
          exists=false
          if git ls-remote --exit-code --heads "$repo" "$name" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags "$repo" "$name" >/dev/null 2>&1; then
            exists=true
          fi

          if [ "$exists" = "true" ]; then
            echo "Tag/branch '${name}' already exists; using it."
            if [[ "$name" == v* ]]; then
              echo "is_version_tag=true" >> "$GITHUB_OUTPUT"
              echo "version_tag=${name}" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$name" == v* ]]; then
            echo "is_version_tag=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=${name}" >> "$GITHUB_OUTPUT"
            echo "Tag '${name}' not found; auto-creating it at the default branch HEAD."
            # Shallow-fetch the default branch, tag its HEAD, and push the tag.
            # Set a git identity explicitly: the runner has none configured
            # before actions/checkout runs, and `git tag -a` requires one.
            tmp=$(mktemp -d)
            git clone --depth 1 --branch "${{ github.event.repository.default_branch }}" "$repo" "$tmp"
            sha=$(git -C "$tmp" rev-parse HEAD)
            git -C "$tmp" config user.name "github-actions[bot]"
            git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$tmp" tag -a "$name" -m "$name"
            git -C "$tmp" push origin "$name"
            rm -rf "$tmp"
            echo "Created tag '${name}' at ${sha}."
          else
            echo "::error::Ref '${ref}' not found in ${{ github.repository }} and is not a version tag (v*). Pass an existing branch/tag or a v* tag to auto-create."
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    outputs:
      amd64_digest: ${{ steps.digest.outputs.amd64 }}
      arm64_digest: ${{ steps.digest.outputs.arm64 }}
    steps:
      - name: Checkout backend (openlist-ext)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: openlist-ext

      - name: Checkout frontend (OpenList-Frontend)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OPENLIST_FRONTEND_REPO || 'sagerenn/OpenList-Frontend' }}
          ref: ${{ vars.OPENLIST_FRONTEND_REF || 'main' }}
          path: openlist-ext/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build a single-platform image and push it by digest (no tag needed on
      # the per-platform image; the manifest step will tag the united image).
      - name: Build and push single-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/openlist-ext
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,push-by-digest=true,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.slug }},mode=max

      - name: Read image digest
        id: digest
        run: |
          # buildx writes the built image digest to BUILDX_METADATA_FILE when
          # DOCKER_METADATA_OUTPUTS is set; otherwise parse the build summary.
          # The most reliable source is the build-push-action's digest output.
          echo "${{ matrix.slug }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "Platform ${{ matrix.platform }} digest: ${{ steps.build.outputs.digest }}"

  manifest:
    name: Unite multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags="${repo}:sha-${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ needs.prepare.outputs.is_version_tag }}" == "true" ]]; then
            tags="${tags},${repo}:latest"
          fi
          if [[ "${{ needs.prepare.outputs.is_version_tag }}" == "true" ]]; then
            tags="${tags},${repo}:${{ needs.prepare.outputs.version_tag }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Final tags: ${tags}"

      - name: Create and push multi-arch manifest
        run: |
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Unite the per-platform images (pushed by digest in the build job)
          # into a single multi-arch manifest, tagged with each release tag.
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          sources=()
          for tag in "${TAG_LIST[@]}"; do sources+=("-t" "$tag"); done
          docker buildx imagetools create \
            "${sources[@]}" \
            "$repo@${{ needs.build.outputs.amd64_digest }}" \
            "$repo@${{ needs.build.outputs.arm64_digest }}"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
